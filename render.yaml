databases:
  - name: lowgas-db
    databaseName: lowgas
    user: lowgas
    plan: free

services:
  - type: web
    name: lowgas-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:schema && npm run admin:bootstrap && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lowgas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22.16.0"
      - key: CLIENT_ORIGIN
        value: "https://lowgas-web.onrender.com,http://localhost,https://localhost,capacitor://localhost"

  - type: web
    name: lowgas-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
